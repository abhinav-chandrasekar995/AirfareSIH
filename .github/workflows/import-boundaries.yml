name: Import boundaries

# Standalone, fast job enforcing ADR-001: app/analytics must never import from
# app/db, app/api, app/collection, app/services, app/tasks or app/middleware.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: backend
        run: |
          pip install import-linter
          lint-imports
