name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: airfare
          POSTGRES_PASSWORD: airfare
          POSTGRES_DB: airfare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airfare"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://airfare:airfare@localhost:5432/airfare_test
      TEST_DATABASE_URL: postgresql+asyncpg://airfare:airfare@localhost:5432/airfare_test
      REDIS_URL: redis://localhost:6379/0
      FORCE_DATA_MODE: REPLAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app
      - name: Enforce analytics import boundaries (ADR-001)
        working-directory: backend
        run: lint-imports
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Load seed dataset
        working-directory: backend
        run: |
          set -o pipefail
          python -m seeds.load_seed | tee /tmp/seed_output.txt
          echo "TEST_ADMIN_API_KEY=$(grep -oP '(?<=ADMIN    )\S+' /tmp/seed_output.txt)" >> "$GITHUB_ENV"
          echo "TEST_PUBLIC_API_KEY=$(grep -oP '(?<=PUBLIC   )\S+' /tmp/seed_output.txt)" >> "$GITHUB_ENV"
      - name: Strip superuser from the CI role (RLS cannot be bypassed in production/Supabase; the official postgres Docker image grants POSTGRES_USER superuser by default, which this app's role must never have - see db/rls.py)
        run: |
          export PGPASSWORD=airfare
          psql -h localhost -U airfare -d airfare_test -c "ALTER ROLE airfare WITH NOSUPERUSER NOBYPASSRLS;"
      - name: DIAGNOSTIC - inspect RLS state directly via psql (temporary, remove after D-084)
        run: |
          export PGPASSWORD=airfare
          echo "--- relrowsecurity / relforcerowsecurity / owner ---"
          psql -h localhost -U airfare -d airfare_test -c "SELECT relname, relrowsecurity, relforcerowsecurity, relowner::regrole FROM pg_class WHERE relname IN ('api_keys','audit_log');"
          echo "--- policies ---"
          psql -h localhost -U airfare -d airfare_test -c "SELECT tablename, policyname, permissive, roles, cmd FROM pg_policies WHERE tablename IN ('api_keys','audit_log');"
          echo "--- current_user / session_user ---"
          psql -h localhost -U airfare -d airfare_test -c "SELECT current_user, session_user;"
          echo "--- PUBLIC role via raw psql, should be 0 ---"
          psql -h localhost -U airfare -d airfare_test -c "SET app.role='PUBLIC'; SELECT count(*) FROM api_keys;"
          echo "--- no role set at all via raw psql, should be 0 ---"
          psql -h localhost -U airfare -d airfare_test -c "SELECT count(*) FROM api_keys;"
          echo "--- ADMIN role via raw psql, for context (real total row count) ---"
          psql -h localhost -U airfare -d airfare_test -c "SET app.role='ADMIN'; SELECT count(*) FROM api_keys;"
      - name: Run tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
