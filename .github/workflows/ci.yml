name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: airfare
          POSTGRES_PASSWORD: airfare
          POSTGRES_DB: airfare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airfare"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://airfare:airfare@localhost:5432/airfare_test
      TEST_DATABASE_URL: postgresql+asyncpg://airfare:airfare@localhost:5432/airfare_test
      REDIS_URL: redis://localhost:6379/0
      FORCE_DATA_MODE: REPLAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app
      - name: Enforce analytics import boundaries (ADR-001)
        working-directory: backend
        run: lint-imports
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Load seed dataset
        working-directory: backend
        run: python -m seeds.load_seed
      - name: Run tests
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
