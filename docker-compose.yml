# Portable local run. `docker compose up` brings up the entire platform with the
# bundled deterministic seed - no external network, no shared credentials. This is the
# judging-day safety net (build prompt Sec.33).
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: airfare
      POSTGRES_PASSWORD: airfare
      POSTGRES_DB: airfare
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airfare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airfare:airfare@db:5432/airfare
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    command: >
      sh -c "alembic upgrade head &&
             python -m seeds.load_seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airfare:airfare@db:5432/airfare
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q collect,pipeline,analytics,ml,maintenance

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airfare:airfare@db:5432/airfare
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    command: celery -A app.tasks.beat_schedule.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  dbdata:
